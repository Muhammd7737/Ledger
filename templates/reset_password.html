<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password · Ledger</title>
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('ledger-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored ? stored === 'dark' : prefersDark;
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="h-full bg-white dark:bg-neutral-900 text-[#37352f] dark:text-neutral-100 transition-colors flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <a href="{{ url_for('index') }}" class="font-bold text-lg tracking-tight">Ledger</a>
    </div>

    <div class="rounded-2xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 p-6 shadow-sm">
      <h1 class="text-xl font-semibold mb-1">Choose a new password</h1>
      <p id="subtext" class="text-sm text-neutral-500 mb-5">Verifying your reset link...</p>

      <div id="errorBox" class="hidden mb-4 rounded-xl px-3 py-2 text-sm bg-red-50 text-red-600 border border-red-200 dark:bg-red-500/10 dark:text-red-300 dark:border-red-500/30"></div>

      <form id="resetForm" class="hidden flex flex-col gap-3">
        <input type="password" name="password" id="password" placeholder="New password" required
               class="w-full rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm text-black dark:text-neutral-100 outline-none focus:border-black dark:focus:border-white" />
        <input type="password" name="confirm" id="confirm" placeholder="Confirm new password" required
               class="w-full rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm text-black dark:text-neutral-100 outline-none focus:border-black dark:focus:border-white" />
        <p class="text-[11px] text-neutral-400 leading-relaxed">
          At least 8 characters, with an uppercase letter, lowercase letter, number, and special character.
        </p>
        <button type="submit"
                class="w-full rounded-xl bg-black dark:bg-white text-white dark:text-black px-4 py-2 text-sm font-semibold hover:bg-neutral-800 dark:hover:bg-neutral-200 transition-colors">
          Update password
        </button>
      </form>

      <div id="invalidLink" class="hidden text-center">
        <a href="{{ url_for('forgot_password') }}" class="text-sm underline underline-offset-2">Request a new reset link</a>
      </div>

      <div id="successBox" class="hidden text-center">
        <p class="text-sm text-emerald-600 dark:text-emerald-400 mb-3">Password updated. You can log in now.</p>
        <a href="{{ url_for('login') }}" class="inline-block w-full rounded-xl bg-black dark:bg-white text-white dark:text-black px-4 py-2 text-sm font-semibold hover:bg-neutral-800 dark:hover:bg-neutral-200 transition-colors">Go to login</a>
      </div>
    </div>
  </div>

  <script>
    const subtext = document.getElementById('subtext');
    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('errorBox');
    const invalidLink = document.getElementById('invalidLink');
    const successBox = document.getElementById('successBox');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove('hidden');
    }

    // Supabase's recovery link appends tokens after # (e.g. #access_token=...&refresh_token=...&type=recovery)
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const type = hashParams.get('type');

    if (!accessToken || !refreshToken || type !== 'recovery') {
      subtext.textContent = 'This reset link is invalid or has expired.';
      invalidLink.classList.remove('hidden');
    } else {
      subtext.textContent = 'Enter a new password for your account.';
      form.classList.remove('hidden');
      // Clean the sensitive tokens out of the visible URL
      history.replaceState(null, '', window.location.pathname);
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorBox.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      try {
        const res = await fetch('{{ url_for("reset_password_update") }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            access_token: accessToken,
            refresh_token: refreshToken,
            password: password
          })
        });
        const data = await res.json();
        if (data.success) {
          form.classList.add('hidden');
          successBox.classList.remove('hidden');
        } else {
          showError(data.message || 'Something went wrong. Please try again.');
        }
      } catch (err) {
        showError('Network error. Please try again.');
      }
    });
  </script>

</body>
</html>

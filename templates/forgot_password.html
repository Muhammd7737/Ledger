<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password · Ledger</title>
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('ledger-theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = stored ? stored === 'dark' : prefersDark;
        if (isDark) document.documentElement.classList.add('dark');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="h-full bg-white dark:bg-neutral-900 text-[#37352f] dark:text-neutral-100 transition-colors flex items-center justify-center px-4">

  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <a href="{{ url_for('index') }}" class="font-bold text-lg tracking-tight">Ledger</a>
    </div>

    <div class="rounded-2xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-800 p-6 shadow-sm">
      <h1 class="text-xl font-semibold mb-1">Reset your password</h1>
      <p class="text-sm text-neutral-500 mb-5">Enter your account email and we'll send you a reset link.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
          <div class="mb-4 rounded-xl px-3 py-2 text-sm {{ 'bg-emerald-50 text-emerald-700 border border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-300 dark:border-emerald-500/30' if category == 'success' else 'bg-red-50 text-red-600 border border-red-200 dark:bg-red-500/10 dark:text-red-300 dark:border-red-500/30' }}">
            {{ message }}
          </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post" class="flex flex-col gap-3">
        <input type="email" name="email" placeholder="you@example.com" required
               class="w-full rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 px-3 py-2 text-sm text-black dark:text-neutral-100 outline-none focus:border-black dark:focus:border-white" />
        <button type="submit"
                class="w-full rounded-xl bg-black dark:bg-white text-white dark:text-black px-4 py-2 text-sm font-semibold hover:bg-neutral-800 dark:hover:bg-neutral-200 transition-colors">
          Send reset link
        </button>
      </form>

      <div class="mt-5 text-center">
        <a href="{{ url_for('login') }}" class="text-xs text-neutral-400 hover:text-black dark:hover:text-white transition-colors">Back to login</a>
      </div>
    </div>
  </div>

</body>
</html>
